vigate twenty-one unique locations to repair the building facade and interior. The game is available on desktop, iOS, and Android.",rating:{value:4.5,count:6058,updated_at:"2026-10-30T23:15:01.779403Z"},developer:"HAPPY GAMES STUDIO",developer_id:620,categories:[bn,bo,j,bp,bq,aO,y,A,br,bs,bt,bu,i,f,B,bv,bw,bx,C,D,o,by],tags:[E,F,G,H,I],series:[],main_category:f,updatedAt:"2026-10-29T15:18:34.258625Z",icon:"https:\u002F\u002Fstatic.playgama.com\u002Fp-img\u002Fpg\u002Fpiece-of-cake-merge--bake\u002Ficon\u002Fdb5eeee7fee34af1984e6c7ff9199283?width=218",preview:"https:\u002F\u002Fstatic.playgama.com\u002Fp-img\u002Fpg\u002Fpiece-of-cake-merge--bake\u002Fbig_preview\u002Fb772122937124aa6b59d6e130537c8a8?width=448",big_preview:"https:\u002F\u002Fstatic.playgama.com\u002Fp-img\u002Fpg\u002Fpiece-of-cake-merge--bake\u002Fbig_preview\u002Fb772122937124aa6b59d6e130537c8a8?width=1200",preview_dominant_color:"#F08C9A",videos:[],video_metadata:[{playgama_id:"73b06d463c9141eb802f8f79f75d208c",external_url:b,type:"gameplay"}],hasInAppPurchases:e,source:"playgama",supported_languages:[h],position:N,rankingDebug:{},config:{ads:{rules:[{type:"internal",data:{intervalScheduleSec:[180],scheduleMode:"repeatLast",skipIfAdShownWithinSec:bz,skipIfAdShownWithinSecAfter:bz,request:[aO]}}]},version:N},badges:[au,S],links:[{id:110,type:"SAMSUNG_STORE",title:b,url:"https:\u002F\u002Fgalaxystore.samsung.com\u002Fdetail\u002Fcom.happygames.mergecafe"},{id:112,type:bA,title:"Microsoft",url:"https:\u002F\u002Fapps.microsoft.com\u002Fdetail\u002F9n5mln8fpwg8?amp%3Bgl=US&hl=en-US"},{id:113,type:bA,title:"Facebook",url:"https:\u002F\u002Fwww.facebook.com\u002Fp\u002FPiece-of-cake-100095132123388\u002F"},{id:109,type:"GOOGLE_STORE",title:b,url:"https:\u002F\u002Fplay.google.com\u002Fstore\u002Fapps\u002Fdetails?id=com.happygames.mergecafe"}],platforms:["ios","android",aP],game_url:"https:\u002F\u002Fcdn.mergecakegame.com\u002Fhtml5\u002Fplaygama\u002Findex.html?platform_id=playgama",engine:["DEFOLD"],description:"Join the enchanting world of Piece of Cake: Merge & Bake, an engaging game that combines puzzle-solving with café management. Explore a beautiful mansion, uncover family secrets, and help Emily grow her café into a culinary empire. Enjoy this unique experience for free on your phone or computer.\n\nControls:\nDesktop: Right-click on buttons, drag items.\nMobile: Tap buttons, drag items with your finger.\n\nKey Features:\n• Expand your cooking table! : Combine ingredients and find matches on the table. Merge and expand your territory! This way, you can cook more masterpieces!\n• Combine ingredients! : Want to create something more complex than a sandwich? Great! Combine ingredients to unlock increasingly complex dishes.\n• Restore the café! : Restore the café and other areas with the money you earn. An incredibly engaging process where you’ll see progress at every stage!\n\nLevels \u002F Maps \u002F Worlds:\n• 21 maps\n• Café. : Your grandfather's café has fallen into disrepair. Why be sad when you can restore it and make it better than before? Get to work!\n• Café facade. : You've done well inside the café, great! But the facade also needs repairs, it's time to work on that too!\n\nStory \u002F Setting:\nYou've come to your grandfather's café in the countryside. Unfortunately, it has long been abandoned. Once a popular spot, it's now your task to restore it and make it even better!\n\nCore Gameplay & Story\nQ: What is the goal of the game?\nA: Revive your grandfather's café and breathe new life into its walls! Cook delicacies for visitors and develop your kitchen by unlocking new dishes!\n\nQ: Is there a story?\nA: You lived in a big city, but you had to return. Your grandfather had an old café, but sadly, it has fallen into disrepair. Help restore it and make it better than before! You will encounter new characters—delight them with your tasty treats!\n\nQ: What grabs you in the first minutes?\nA: Pleasant graphics, everything looks cozy and warm. It's especially satisfying to watch the progress of the café's reconstruction. With each amount earned, you can repair and upgrade your café and move on to other locations! With each new stage, you will see progress.\n\nMechanics & Progression\nQ: How many levels are there \u002F is the structure clear?\nA: The game features a total of 21 locations! You will restore them one by one, cooking food and drinks. Each location is unique with its own distinct style and theme.\n\nQ: How can I level up faster?\nA: Combine ingredients to get new ones. Expand your cooking table to hold more ingredients. Upgrade your kitchen tools to cook more efficiently!\n\nQ: What unlocks as you progress?\nA: As you play, you will expand your table, allowing you to accommodate more ingredients for cooking. You will also upgrade your kitchen setup, receiving new equipment. But you won't be limited to just the kitchen. New locations will unlock as you progress through the game!\n\nEconomy & Customization\nQ: What can be bought\u002Fupgraded?\nA: Upgrade the café and other locations. And don't forget about kitchen tools. With them, you can cook more delicious food!\n\nQ: What is available from the start?\nA: You start with an abandoned coffee shop and gradually, step by step, restore it. It's very engaging to watch life return to a once-popular place!\n\nRetention & Engagement\nQ: Is sound necessary?\nA: You can play anywhere and even without sound if that suits you better.\n\nQ: Is there onboarding in the game? What is it like?\nA: From the first missions, the game will show you what to do and how to do it. Additionally, hints will guide you in moments where you might miss something. But don’t worry, you’ll understand everything quickly!",how_to_play_text:"Use mouse or your finger tap for navigation in this game.",seo_text:"\u003Ch2\u003EAbout Piece of Cake: Merge &amp; Bake\u003C\u002Fh2\u003E\n\u003Cp\u003EPiece of Cake: Merge & Bake drops you into an enchanting world that blends puzzle-solving with café management. You return to your grandfather's countryside café — once a beloved gathering spot, now long abandoned — and take on the task of restoring it to its former glory and beyond. The game pairs a warm, cozy atmosphere with satisfying merge mechanics, letting you watch a neglected space come back to life stage by stage. Pleasant graphics keep everything looking inviting, and progress feels tangible with every repair and upgrade completed.\u003C\u002Fp\u003E\n\n\u003Ch3\u003EStory \u002F Setting\u003C\u002Fh3\u003E\n\u003Cp\u003EYou grew up in a big city, but circumstances bring you back to your grandfather's old café in the countryside. The place has fallen into disrepair after years of abandonment. Your mission is to restore it, cook delicacies for visitors, and develop the kitchen by unlocking new dishes. Along the way you'll encounter new characters and delight them with your cooking. Each of the 21 locations carries its own distinct style and theme, waiting to be brought back to life one by one.\u003C\u002Fp\u003E\n\n\u003Ch2\u003EHow to Play Piece of Cake: Merge & Bake: Merge, Cook, and Restore\u003C\u002Fh2\u003E\n\u003Cp\u003EStart with an abandoned café and restore it step by step by earning money through cooking. Combine ingredients on the table to unlock increasingly complex dishes, and merge items to expand your territory so the table can hold more ingredients at once. Upgrade kitchen tools to cook more efficiently, and use the money earned to repair the café and other areas. New locations unlock as you progress, each requiring restoration in turn. From the first missions, the game guides you through what to do, and hints appear whenever you might miss something.\u003C\u002Fp\u003E\n\n\u003Ch3\u003ELevels \u002F Maps \u002F Worlds\u003C\u002Fh3\u003E\n\u003Cul\u003E\u003Cli\u003E\u003Cb\u003E21 maps total\u003C\u002Fb\u003E: Each location is unique with its own distinct style and theme, restored one by one as you progress.\u003C\u002Fli\u003E\u003Cli\u003E\u003Cb\u003ECafé\u003C\u002Fb\u003E: Your grandfather's café has fallen into disrepair — restore it and make it better than before.\u003C\u002Fli\u003E\u003Cli\u003E\u003Cb\u003ECafé facade\u003C\u002Fb\u003E: Once the interior is sorted, the exterior needs attention too; repairs continue outside.\u003C\u002Fli\u003E\u003C\u002Ful\u003E\n\n\u003Ch2\u003EControls\u003C\u002Fh2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cb\u003ERight-click (Desktop)\u003C\u002Fb\u003E: Interact with buttons\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003EDrag (Desktop)\u003C\u002Fb\u003E: Move items on the table\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003ETap (Mobile)\u003C\u002Fb\u003E: Interact with buttons\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003EDrag with finger (Mobile)\u003C\u002Fb\u003E: Move items on the table\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Ch2\u003EKey Features\u003C\u002Fh2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cb\u003EExpand your cooking table\u003C\u002Fb\u003E: Combine ingredients and find matches on the table to merge and expand your territory, making room to cook more dishes.\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003ECombine ingredients\u003C\u002Fb\u003E: Merge ingredients to unlock increasingly complex recipes, going well beyond simple dishes.\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003ERestore the café\u003C\u002Fb\u003E: Use the money you earn to repair the café and other areas, with visible progress at every stage of reconstruction.\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Ch2\u003EFAQ\u003C\u002Fh2\u003E\n\u003Cdiv itemscope itemtype=\"https:\u002F\u002Fschema.org\u002FFAQPage\"\u003E\n\u003Cdiv itemscope itemprop=\"mainEntity\" itemtype=\"https:\u002F\u002Fschema.org\u002FQuestion\"\u003E\n\u003Ch3 itemprop=\"name\"\u003EHow many locations does Piece of Cake: Merge & Bake include?\u003C\u002Fh3\u003E\n\u003Cdiv itemscope itemprop=\"acceptedAnswer\" itemtype=\"https:\u002F\u002Fschema.org\u002FAnswer\"\u003E\n\u003Cp itemprop=\"text\"\u003EThe game has 21 locations in total. Each one has its own distinct style and theme, and you restore them one by one as you progress through the game.\u003C\u002Fp\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cdiv itemscope itemprop=\"mainEntity\" itemtype=\"https:\u002F\u002Fschema.org\u002FQuestion\"\u003E\n\u003Ch3 itemprop=\"name\"\u003EWhat unlocks as I advance through the game?\u003C\u002Fh3\u003E\n\u003Cdiv itemscope itemprop=\"acceptedAnswer\" itemtype=\"https:\u002F\u002Fschema.org\u002FAnswer\"\u003E\n\u003Cp itemprop=\"text\"\u003EAs you play, your cooking table expands to hold more ingredients, your kitchen setup gains new equipment, and entirely new locations open up for restoration.\u003C\u002Fp\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cdiv itemscope itemprop=\"mainEntity\" itemtype=\"https:\u002F\u002Fschema.org\u002FQuestion\"\u003E\n\u003Ch3 itemprop=\"name\"\u003EHow do I progress more quickly?\u003C\u002Fh3\u003E\n\u003Cdiv itemscope itemprop=\"acceptedAnswer\" itemtype=\"https:\u002F\u002Fschema.org\u002FAnswer\"\u003E\n\u003Cp itemprop=\"text\"\u003ECombine ingredients to produce new ones, expand your cooking table to accommodate more at once, and upgrade your kitchen tools to cook more efficiently.\u003C\u002Fp\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cdiv itemscope itemprop=\"mainEntity\" itemtype=\"https:\u002F\u002Fschema.org\u002FQuestion\"\u003E\n\u003Ch3 itemprop=\"name\"\u003EIs sound required to enjoy the game?\u003C\u002Fh3\u003E\n\u003Cdiv itemscope itemprop=\"acceptedAnswer\" itemtype=\"https:\u002F\u002Fschema.org\u002FAnswer\"\u003E\n\u003Cp itemprop=\"text\"\u003ENo — the game is fully playable without sound, so you are able to enjoy it anywhere that suits you.\u003C\u002Fp\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cdiv itemscope itemprop=\"mainEntity\" itemtype=\"https:\u002F\u002Fschema.org\u002FQuestion\"\u003E\n\u003Ch3 itemprop=\"name\"\u003EDoes the game explain itself to new players?\u003C\u002Fh3\u003E\n\u003Cdiv itemscope itemprop=\"acceptedAnswer\" itemtype=\"https:\u002F\u002Fschema.org\u002FAnswer\"\u003E\n\u003Cp itemprop=\"text\"\u003EFrom the very first missions the game shows you what to do and how to do it, and hints appear at moments where you might otherwise miss something.\u003C\u002Fp\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Ch2\u003EGames You Might Like\u003C\u002Fh2\u003E\n\u003Cp\u003EIf the merge-and-restore loop appeals to you, \u003Ca href=\"https:\u002F\u002Fplaygama.com\u002Fgame\u002Fhidden-threads-match-3--stories\" style=\"text-decoration: none;\"\u003EHidden Threads: Match 3 & Stories\u003C\u002Fa\u003E offers a similar satisfaction of rebuilding locations and uncovering stories through puzzle levels. For more kitchen action and restaurant building, \u003Ca href=\"https:\u002F\u002Fplaygama.com\u002Fgame\u002Fcooking-tasty-restaurant-game\" style=\"text-decoration: none;\"\u003ECooking Tasty: Restaurant Game\u003C\u002Fa\u003E puts you in charge of a growing eatery where you cook and serve your way to success. Fans of cozy progression games will also enjoy \u003Ca href=\"https:\u002F\u002Fplaygama.com\u002Fgame\u002Fthe-farmers-graces-island\" style=\"text-decoration: none;\"\u003EThe Farmers: Grace's Island\u003C\u002Fa\u003E, a charming farming adventure where you cultivate crops, craft recipes, and expand into new territories.\u003C\u002Fp\u003E\n\u003Cp\u003EBrowse more titles in the \u003Ca href=\"https:\u002F\u002Fplaygama.com\u002Fcategory\u002Fgirls\" style=\"text-decoration: none;\"\u003EGirls games\u003C\u002Fa\u003E collection, or explore the full range of \u003Ca href=\"https:\u002F\u002Fplaygama.com\u002Fcategory\u002Fpuzzle\" style=\"text-decoration: none;\"\u003EPuzzle games\u003C\u002Fa\u003E and \u003Ca href=\"https:\u002F\u002Fplaygama.com\u002Fcategory\u002Ffood\" style=\"text-decoration: none;\
