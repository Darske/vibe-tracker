l settings. Every gun's range matches CS2, AUG reloads faster, grenades closer to CS2. Detachable silencers on M4A1-S and USP-S. New SG 553 look, olive xbox in mid, sunlit palms. Bodies fall faster and land flat. Phone fixes for snipers, fire and buying.\",\"update_name\":\"CS2 Feel Update\",\"update_slug\":\"cs2-feel-update\",\"weight\":\"big\",\"box_art_url\":null,\"published_at\":\"2026-10-29T00:41:45.67691+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null},{\"id\":\"71ca94f7-76a4-41f0-a388-8ad629b77c76\",\"app_id\":\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"spec_version\":659,\"world_manifest\":\"04325381ec3eacfbbecc8c6a8948c209b93dbc8cdd55bdd27dcd5b1fb1fbde0a\",\"world_commit\":\"4fc9e36e4f28f4f45010d36dc0af025f91748f2b\",\"engine_version\":\"6.0.0\",\"description\":\"You drop into a sun-bleached desert map and immediately grab an AK, hunting for angles and fights. You trade kills with nine other players and bots, respawning in seconds to do it again, chasing that first to 30 kills. Every duel is yours to win or lose, and the scoreboard never stops climbing.\",\"changelog\":\"Every bot now has its own profile picture on the top bar, scoreboard and death notice. Controllers: A jumps, B crouches, L3 walks, RB/LB switch weapons, R3 knife, d-pad left grenades. No more INVULNERABLE text after spawning.\",\"update_name\":\"Bot Faces & Pad Controls\",\"update_slug\":\"bot-faces-pad-controls\",\"weight\":\"feature\",\"box_art_url\":null,\"published_at\":\"2026-10-27T21:08:01.340965+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null},{\"id\":\"e974b302-310c-4ee8-ba21-7e7ddfcdc07b\",\"app_id\":\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"spec_version\":379,\"world_manifest\":\"511c23de5e835325ab4db0a54e2c6a3c64ef08e258ba23a41c2263e06b719200\",\"world_commit\":\"4b72911a801e04499919aa2d542633c5b3f0a1ab\",\"engine_version\":\"6.0.0\",\"description\":\"You drop into a sun-bleached desert map and immediately grab an AK, hunting for angles and fights. You trade kills with nine other players and bots, respawning in seconds to do it again, chasing that first to 30 kills. Every duel is yours to win or lose, and the scoreboard never stops climbing.\",\"changelog\":\"Rooms now hold up to 16 players; when one fills, new players get their own room. Nothing else changed.\",\"update_name\":\"16-Player Rooms\",\"update_slug\":\"16-player-rooms\",\"weight\":null,\"box_art_url\":null,\"published_at\":\"2026-10-26T13:42:58.188+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null},{\"id\":\"cb39ec12-46f9-468e-a18d-f2c83bae39d3\",\"app_id\":\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"spec_version\":385,\"world_manifest\":\"ce07d4b8a030ff64582c45a8938c531cb797c764ab07d4e1317c5fd939349690\",\"world_commit\":\"f98a8ce7ed2ef7306c370493bb5b57918da32e8d\",\"engine_version\":\"6.0.0\",\"description\":\"You drop into a sun-bleached desert map and immediately grab an AK, hunting for angles and fights. You trade kills with nine other players and bots, respawning in seconds to do it again, chasing that first to 30 kills. Every duel is yours to win or lose, and the scoreboard never stops climbing.\",\"changelog\":\"Open the buy menu with B during spawn immunity to pick your primary, pistol, Zeus, and grenades from a grid like CS2's.\\nYour chosen loadout saves across lives — swap columns with number keys 1–5, then pick a cell with 1–5 again.\\nAn agent stands beside the buy menu holding the gun under your cursor, so you see what you're about to buy.\\nDecoy grenades join the arsenal: throw one to fake your position while you flank.\",\"update_name\":\"Buy Menu Live\",\"update_slug\":\"buy-menu-live\",\"weight\":null,\"box_art_url\":null,\"published_at\":\"2026-10-08T23:36:34.550949+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null},{\"id\":\"aeb2c022-7ecf-4467-b89f-237c37366b09\",\"app_id\":\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"spec_version\":328,\"world_manifest\":\"fee931560479a6d3910c3b7ca365d08c83d84528450a196c4a0e5ecc38235330\",\"world_commit\":\"34abff8701c0bd13c5a548fd3b8c0482cc9d7338\",\"engine_version\":\"6.0.0\",\"description\":\"You drop into a sun-bleached desert map and immediately grab an AK, hunting for angles and fights. You trade kills with nine other players and bots, respawning in seconds to do it again, chasing that first to 30 kills. Every duel is yours to win or lose, and the scoreboard never stops climbing.\",\"changelog\":\"Rounds now punch through wooden doors and thin metal — wallbang like CS2.\\nBodies bleed from bullet wounds and sparks fly off helmets instead of a white flash.\\nBoth T and CT agents grip their guns with real fingers instead of fists.\\nA helmeted headshot dinks with the AK (and other weapons behave like CS2 now)\\nCinematic camera flies through the map's best angles — mark your body to film it.\",\"update_name\":\"Wallbang & Fingers\",\"update_slug\":\"wallbang-fingers\",\"weight\":null,\"box_art_url\":null,\"published_at\":\"2026-10-04T05:57:35.254432+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null},{\"id\":\"34e3ca0b-f2ed-4e1d-b96c-3bde1d554105\",\"app_id\":\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"spec_version\":307,\"world_manifest\":\"68cdbd439d80d8595b3dc356ab33593056356b4740a4edc29962811ee51afb18\",\"world_commit\":\"bccda4dff2f52ddc1676e63426c85b58f9aee39a\",\"engine_version\":\"6.0.0\",\"description\":\"You drop into a sun-bleached desert map and immediately grab an AK, hunting for angles and fights. You trade kills with nine other players and bots, respawning in seconds to do it again, chasing that first to 30 kills. Every duel is yours to win or lose, and the scoreboard never stops climbing.\",\"changelog\":\"The zoo now hosts deathmatch — pick your side when you join, fire at once after you respawn, and the scoreboard shows everyone's ping.\\nRifles and pistols sit lower in your hands, under your chin like CS2's agents hold them.\\nDust speaks: fighters call grenades by name, cry out when hit, and radio commands answer your Z key — the radio sits bottom left like the comms band it is.\\nThe main menu stands ready — press P to change your crosshair, mouse speed and keys, or swap sides and jump back in.\\nOn a phone, only your gun in hand loads before the fight starts; grenades and other arms load when you draw them.\",\"update_name\":\"Zoo Arrives\",\"update_slug\":\"zoo-arrives\",\"weight\":null,\"box_art_url\":null,\"published_at\":\"2026-10-02T20:49:59.614741+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null},{\"id\":\"7593f07e-df07-467b-953a-08befb3e7bd8\",\"app_id\":\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"spec_version\":262,\"world_manifest\":\"223d248481e3ec310b38ed5487e3fc1532fe3972c41794fc6f0e1c31d43a22b1\",\"world_commit\":\"55e4fcbcc4754b1e4d357fe057636a90691f3438\",\"engine_version\":\"6.0.0\",\"description\":\"You drop into a sun-bleached desert map and immediately grab an AK, hunting for angles and fights. You trade kills with nine other players and bots, respawning in seconds to do it again, chasing that first to 30 kills. Every duel is yours to win or lose, and the scoreboard never stops climbing.\",\"changelog\":null,\"update_name\":null,\"update_slug\":\"initial-release\",\"weight\":null,\"box_art_url\":null,\"published_at\":\"2026-09-28T20:46:00.418543+00:00\",\"description_draft\":null,\"changelog_draft\":null,\"published_by\":null}],\"total\":7},\"dataUpdateCount\":1,\"dataUpdatedAt\":1793419011087,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"versioning\",\"publishes\",\"10997fa1-3d68-4252-826f-7d35f5ba3394\",\"list\",25],\"queryHash\":\"[\\\"versioning\\\",\\\"publishes\\\",\\\"10997fa1-3d68-4252-826f-7d35f5ba3394\\\",\\\"list\\\",25]\"},{\"dehy
