# Registry of platforms. The pipeline iterates over enabled entries only.
# Adding a platform = one adapter file + one entry here + one fixture folder. See docs/ADDING_A_SOURCE.md.

tesana:
  module: tracker.sources.tesana
  display_name: Tesana
  segment: creation
  enabled: true
  # catalog = the whole marketplace most-played first (~60 requests); the charts stay as ranked lists.
  lists: [played, trending, new, rising, popular, playing_now, catalog]
  ccu_lists: [playing_now, played]  # polled every 30 min by the ccu workflow (3 requests): live rooms + the weekly top 100 (rows carry playing_now)
  top_n: 100
  list_top_n:
    catalog: 5000
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 5000
  metric_map:
    plays: "plays = play sessions started (Tesana play_count)"
    players: "players = unique players in the trailing 7 days (Tesana players_7d)"
    players_now: "players now = concurrent players right now (Tesana playing_now)"

rosebud:
  module: tracker.sources.rosebud
  display_name: Rosebud AI
  segment: creation
  enabled: true
  # top 1,000 by all-time plays (10 list pages; the list is also the batch counters endpoint, so no extra requests).
  # Coverage check Nov 3: top 100 = 42% of top-10k plays, top 1,000 = 80%.
  lists: [top, new]
  top_n: 100
  list_top_n:
    top: 1000
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 1500
  metric_map:
    plays: "plays = game-page loads / sessions started, not unique (Rosebud plays_count)"
    remixes: "remixes = clones incl. unpublished (Rosebud clones_count)"

bitmagic:
  module: tracker.sources.bitmagic
  display_name: Bitmagic
  segment: creation
  enabled: true
  lists: [trending, popular, new]
  ccu_lists: [popular]              # browse (3 req) + batch + live counts
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 200
  metric_map:
    plays: "plays = Play-button presses, deduped per viewer session (Bitmagic playCount)"
    players_now: "players now = players in a room right now (Bitmagic live counts)"

astrocade:
  module: tracker.sources.astrocade
  display_name: Astrocade
  segment: creation
  enabled: true
  # top_picks ("Players' Choice") and trending are the ranked lists (~30 each); genre rows cap at 100.
  lists: [top_picks, trending, beta, tactics, meme, creative, zen, farm, puzzle, platformer, adventure, simulation, educational, action, merge, chat, cooking, horror, survival, sports, arcade, incremental, toys]
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 2500
  metric_map:
    plays: "plays = session starts, each time a user starts the game (Astrocade plays)"
    remixes: "remixes = child remixes (Astrocade remixCount)"

spawn:
  module: tracker.sources.spawn
  display_name: Spawn
  segment: creation
  enabled: true
  # Server-rendered HTML only (/api is robots-disallowed). top/new/multiplayer = /?filter=<name>, anything
  # else = /?genre=<name>; each list is its first page (23-24 cards, 63 on multiplayer — ?offset= paging
  # returns the same page). multiplayer is sorted by concurrent players and is the CCU source.
  lists: [top, multiplayer, new, action, shooter, rpg, strategy, horror, cozy, puzzle]
  ccu_lists: [multiplayer]          # the one page that carries players-online for ~60 games (1 request)
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 300
  metric_map:
    plays: "plays = cumulative play sessions (Spawn play_count)"
    players_now: "players now = concurrent players in rooms right now (Spawn playing)"

wavedash:
  module: tracker.sources.wavedash
  display_name: Wavedash
  segment: aggregator
  enabled: true
  # trending = the ~4-12 games with a live concurrent-player count (2 requests); featured = feed phase 0,
  # 48 games (2 requests). Optional `catalog` walks the whole feed in feed order (~53 requests, ~1 min at
  # 1 r/s) so every one of the ~1,270 games gets a first-seen date (new games/day). There is no `new`
  # list: the feed carries no publish dates and resolving them costs one request per game.
  lists: [trending, featured]
  ccu_lists: [trending]             # the only games with a public concurrent-player count
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 150
  metric_map:
    players_now: "players now = concurrent players in-game, published only for the ~12 trending games (Wavedash)"
    plays: "plays = not public on Wavedash; only list placements and comments are tracked"

remix:
  module: tracker.sources.remix
  display_name: Remix
  segment: creation
  enabled: true
  # picks/latest/multiplayer = home-page shelves (one request); <category> = the 48-game grid with counters
  # on /category/<name>; most_played_<category> = that page's "most played first" chip list (120 slugs, no
  # counters, so each costs one /g/<slug> request). /api/* and /games/* are robots-disallowed and never used.
  lists: [picks, latest, multiplayer, action, casual, adventure, puzzle, shooter, platformer, simulation, strategy, rpg, most_played_action, most_played_casual]
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 400
  metric_map:
    plays: "plays = play sessions started (Remix playCount)"
    players: "players = unique users who played, all time (Remix usersCount)"
    likes: "likes = thumbs up (Remix thumbsUpCount)"

playgama:
  module: tracker.sources.playgama
  display_name: Playgama
  segment: aggregator
  enabled: true
  # /api/ is robots-disallowed; lists come from the SSR window.__query state of /category/<name>?page=N
  # (45 per page); counters need one GET /game/<hru> per game (~200 requests ≈ 3.5 min at 1 r/s).
  lists: [top_playgama, trending_now, new]
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 250
  metric_map:
    votes: "votes = player ratings / likes (Playgama rating.count)"
    players: "players = players ranked on the game's 7-day playtime leaderboard (Playgama leaderboard.totalPlayers)"
    plays: "plays = not public on playgama.com; placements, votes and weekly leaderboard players are tracked"

playgama_ai:
  module: tracker.sources.playgama_ai
  display_name: Playgama AI
  segment: aggregator
  enabled: true
  # Static Astro HTML of https://playgama.ai/play (one request, all tabs); other tabs that exist:
  # playtime, challenge, claude24h, codex24h, cursor24h. developer.playgama.com/api is robots-disallowed.
  lists: [plays24h, playsAllTime, likesAllTime, freshDrops]
  top_n: 100
  poll_every_hours: 2
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 200
  # game_pages: true → one GET /play/<id> per game for the exact all-time play count (cards only show "2.5k")
  game_pages: true
  metric_map:
    plays: "plays = sessions of 30 s or more counted by Playgama Bridge (playgama.ai all-time plays)"
    plays_24h: "plays 24h = Playgama's own trailing-24h play count"
    likes: "likes = all-time likes shown on the Most Liked / Challenge cards only (rounded above 1k)"

# ---------------------------------------------------------------------------------------------------------------
# Legacy web game platforms (cohort: legacy) — established portals that also host vibe-coded games.
# Research: docs/SOURCES_LEGACY.md. CrazyGames' and Poki's terms forbid automated collection; the owner chose to
# track them anyway (Nov 10, 2026), so they run at minimal impact: CrazyGames once a day, Poki <=1 request / 3 s.
# Set enabled: false to stop any of them.

crazygames:
  module: tracker.sources.crazygames
  display_name: CrazyGames
  segment: aggregator
  cohort: legacy
  enabled: true
  lists: [hot, top, new, catalog]   # catalog = whole catalogue via sorting=new (~47 pages, shared with `new`)
  top_n: 100
  list_top_n: {catalog: 6000}
  poll_every_hours: 24              # plays refresh about daily and the API is edge-cached 4 h
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 1500             # snapshot the 1,500 most-played (whole catalogue ~2 MB/day of storage)
  metric_map:
    plays: "plays = all-time game starts (CrazyGames totalPlays, refreshed about daily; new games read as unknown)"
    likes: "likes = all-time likes (CrazyGames totalLikes)"

poki:
  module: tracker.sources.poki
  display_name: Poki
  segment: aggregator
  cohort: legacy
  enabled: true
  # api.poki.com JSON only (poki.com disallows /*?), <=1 request / 3 s, no browser, no game pages.
  lists: [home, popular, new]
  top_n: 100
  poll_every_hours: 6
  rate_limit_rps: 0.33
  needs_browser: false
  live_players: false
  stale_after_days: 30
  max_watchlist: 400
  metric_map:
    likes: "likes = thumbs-up votes, all-time (Poki rating.up_count)"
    votes: "votes = total thumbs up + down, all-time (Poki publishes no play counts; the change in votes is the usage proxy)"

itchio:
  module: tracker.sources.itchio
  display_name: itch.io
  segment: aggregator
  cohort: legacy
  enabled: true
  lists: [popular, new_popular, top_rated, top_sellers, ai_popular, ai_code, no_ai, newest]
  top_n: 100
  poll_every_hours: 6
  rate_limit_rps: 0.04              # ~1 request / 25 s: itch.io rate-limits hard (429)
  needs_browser: false
  stale_after_days: 14
  max_watchlist: 800
  metric_map:
    votes: "votes = number of ratings (only recorded when the game is on the top-rated list)"
    plays: "not published: itch.io shows plays, views and downloads only to the game's owner"
    ai: "AI = the creator's own generative-AI disclosure (AI-assisted / AI code lists, or the No AI tag)"

kongregate:
  module: tracker.sources.kongregate
  display_name: Kongregate
  segment: aggregator
  cohort: legacy
  enabled: true
  lists: [hot, new, action_top, puzzle_top, adventure-rpg_top, idle_top, multiplayer_top, strategy-defense_top]
  top_n: 100
  poll_every_hours: 6               # ~850-900 requests per poll (~15 min at 1 req/s)
  rate_limit_rps: 1
  needs_browser: false
  stale_after_days: 30
  max_watchlist: 900
  max_game_pages_per_run: 60
  game_page_every_hours: 168
  metric_map:
    plays: "plays = all-time gameplays (Kongregate gameplays_count)"
    likes: "likes = users who added the game to their favourites"
    votes: "votes = number of star ratings (empty while the game is 'under judgement')"
    ai: "AI = the game's own declaration in its description: declared AI use / declared no AI / not declared"
