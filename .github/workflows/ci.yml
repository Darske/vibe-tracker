name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "41 7 * * 0"   # weekly live smoke test, Sundays 07:41 UTC
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live smoke test against real platforms"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vibe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTACT_EMAIL: ci@example.invalid
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/vibe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - name: Unit, parse and derive tests (no network)
        run: python -m pytest -q
      - name: Live smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m pytest -q -m live --override-ini="addopts="

  weekly-live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .[dev]
      - run: python -m pytest -q -m live --override-ini="addopts="
