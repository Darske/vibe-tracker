name: scrape

on:
  schedule:
    - cron: "23 * * * *"   # hourly trigger; the poller skips platforms polled <2 h ago, so the real cadence stays 2 h (GitHub fires schedules late under load)
  workflow_dispatch:
    inputs:
      source:
        description: "Run a single source (slug from sources.yaml); empty = all enabled"
        required: false
        default: ""
      force:
        description: "Ignore poll_every_hours freshness check"
        type: boolean
        default: false
      limit:
        description: "Cap the watchlist per source (testing)"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RUN_TIME_BUDGET_SECONDS: "1500"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Install Playwright Chromium (only if an enabled source needs a browser)
        run: |
          if python -c "import sys, yaml; s=yaml.safe_load(open('sources.yaml')); sys.exit(0 if any((v or {}).get('enabled') and (v or {}).get('needs_browser') for v in s.values()) else 1)"; then
            pip install -e .[browser] && python -m playwright install --with-deps chromium
          else
            echo "no browser sources enabled; skipping"
          fi

      - name: Apply schema (idempotent)
        run: python -m tracker.db init

      - name: Run pipeline
        run: |
          ARGS=""
          [ -n "${{ inputs.source }}" ] && ARGS="$ARGS --source ${{ inputs.source }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          python -m tracker.pipeline run $ARGS 2>&1 | tee run.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 14
