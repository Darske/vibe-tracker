name: measure

# Read-only storage report: which tables grow, rows/day by full scrape vs players-online poll, share of repeated
# readings, dormant games, days until the 500 MB free-tier limit. Results appear on the run's Summary page.
# Manual only (Actions -> measure -> Run workflow). Changes nothing in the database.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Measure storage
        run: python -m tracker.measure
